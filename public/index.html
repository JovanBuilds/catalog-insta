<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkML - Catálogo de Productos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="store-info">
                <img id="storeLogo" class="store-logo" src="" alt="Logo">
                <div class="store-details">
                    <h1 id="storeName" class="store-name">Cargando...</h1>
                    <p id="storeDescription" class="store-description">Cargando...</p>
                </div>
            </div>
            <a id="whatsappGeneral" href="#" class="btn-whatsapp-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                    </path>
                </svg>
                Escribirme
            </a>
        </div>
    </header>

    <!-- Filters -->
    <div class="filters-container">
        <div class="container">
            <div id="categoryFilters" class="category-filters">
                <button class="filter-chip active" data-category="all">Todos</button>
            </div>
        </div>
    </div>

    <!-- Products Grid -->
    <main class="main-content">
        <div class="container">
            <div id="productsGrid" class="products-grid">
                <!-- Products will be loaded here -->
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Cargando productos...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>Hecho con ❤️ para vendedores de Instagram</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
